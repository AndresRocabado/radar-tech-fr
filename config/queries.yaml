# Collecte large : une recherche par mot-clé, sans filtre de contrat. L'alternance
# est isolée ensuite dans le dashboard, via la colonne est_alternance.
#
# Comportement de motsCles mesuré sur l'API le 2026-09-18 :
# - les mots d'une expression sont cherchés séparément, puis combinés en ET, sans
#   recherche d'expression exacte : espace, virgule et %20 donnent le même total
#   (« data engineer » = 563, « data » = 1275, « engineer » = 893) ;
# - le tiret sépare aussi les mots : « no-code » = « no code » = 10 ;
# - la forme soudée ne matche rien : « nocode », « lowcode », « powerapps » = 0.
# Zéros vérifiés sous toutes leurs variantes, donc écartés : zapier,
# power automate, airtable, make.com.

defaults:
  # 150 est le maximum accepté par l'API : au-delà elle répond 400.
  page_size: 150
  # Plafond volontaire par recherche. L'API refuse de toute façon une position
  # de début supérieure à 3000, soit 3150 offres au maximum par recherche ;
  # au-delà, le client découpe la recherche par date de création.
  max_results_per_search: 3000
  # Fenêtre de collecte utilisée quand une recherche doit être découpée.
  lookback_days: 365

keywords:
  # Data
  - data engineer
  - data analyst
  - data scientist
  - data architect
  - data manager
  - big data
  - business intelligence
  - power bi
  - ingenieur donnees
  - analyste donnees
  - chef de projet data
  # IA (« IA » seul est trop bruité : écarté)
  - intelligence artificielle
  - machine learning
  - deep learning
  - mlops
  - llm
  # No-code / low-code
  - no-code
  - low-code
  - power platform
  - power apps
  - rpa
  - n8n
  - bubble

# Bornes de vraisemblance des salaires annualisés, vérifiées par les tests.
# SMIC brut annuel sur une base 35h : 11,88 €/h x 35 x 52 = 21 621,60 €.
# À revoir à chaque revalorisation du SMIC.
# Un apprenti est légalement payé entre 27 % et 100 % du SMIC selon son âge et
# l'année de son contrat, d'où un plancher distinct pour l'alternance : sans
# lui, toutes les offres réellement collectées seraient signalées à tort.
salaire:
  smic_annuel: 21621.60
  ratio_plancher_alternance: 0.27
  plafond_annuel: 300000
