name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Le plancher déclaré dans pyproject.toml, et la version suivante.
        # 3.11 est exclue : numpy 2.5 et scipy 1.18 exigent 3.12.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        # requirements-dev tire requirements.txt, donc la pile ML. La roue CPU
        # de torch vient de l'index déclaré dans requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests
        # data/raw/ n'est pas versionné : les tests de qualité des données qui
        # en dépendent se signalent en « skipped », les autres doivent passer.
        run: pytest -q --junit-xml=pytest-results.xml

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
